<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123b4a" />
    <meta name="description" content="Practical event tools for student society teams" />
    <link rel="icon" href="/soc/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/soc/art/sky.webp" as="image" type="image/webp" />
    <script>try{const t=localStorage.getItem("soc.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch{}</script>
    <style>
      html,body,#root{min-height:100%;margin:0}.boot{position:fixed;inset:0;overflow:hidden;background:#b9dcda;color:#173a43;font:800 1.2rem ui-rounded,"Arial Rounded MT Bold",sans-serif}.boot-art{position:absolute;inset:-3%;background:url("/soc/art/sky.webp") center/cover;transform:scale(1.04)}.boot-art::after{position:absolute;inset:0;background:linear-gradient(90deg,#c7e3dfed 0 23%,#c7e3dfa8 36%,transparent 58%);content:""}.boot-brand{position:absolute;top:24px;left:max(20px,calc((100% - 1240px)/2));padding:10px 14px;border:2px solid #244d57;background:#fff9eb;box-shadow:2px 3px 0 #244d57}.boot-status{position:absolute;right:24px;bottom:22px;font:700 .8rem "Avenir Next",sans-serif}html[data-theme=dark] .boot{background:#101c21;color:#f2efe5}html[data-theme=dark] .boot-art{filter:brightness(.55) saturate(.9)}html[data-theme=dark] .boot-art::after{background:linear-gradient(90deg,#173139f2 0 23%,#173139b8 36%,transparent 62%)}html[data-theme=dark] .boot-brand{border-color:#91a8ac;background:#222f33;box-shadow:2px 3px 0 #91a8ac}@media(prefers-color-scheme:dark){html:not([data-theme=light]) .boot{background:#101c21;color:#f2efe5}html:not([data-theme=light]) .boot-art{filter:brightness(.55) saturate(.9)}html:not([data-theme=light]) .boot-art::after{background:linear-gradient(90deg,#173139f2 0 23%,#173139b8 36%,transparent 62%)}html:not([data-theme=light]) .boot-brand{border-color:#91a8ac;background:#222f33;box-shadow:2px 3px 0 #91a8ac}}
    </style>
    <title>SOC Minis</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="SOC Minis is loading">
        <div class="boot-art" aria-hidden="true"></div>
        <strong class="boot-brand">SOC Minis</strong>
        <span class="boot-status">Charting the islands…</span>
      </div>
    </div>
    <noscript>SOC Minis needs JavaScript to prepare event files and follow bookings</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
